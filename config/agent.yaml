agent:
  name: "Yi Min"
  workspace_dir: "../workspace"
  max_iterations: 8
  # 10 轮对话 = 最近 10 条用户消息及其助手回复，约 20 条历史消息。
  context_history_turns: 10

providers:
  config_file: "providers.yaml"
  default_primary: "qwen"

tools:
  shell:
    enabled: true
    requires_confirmation: false

observability:
  langfuse:
    enabled: true
    public_key_env: "LANGFUSE_PUBLIC_KEY"
    secret_key_env: "LANGFUSE_SECRET_KEY"
    base_url: "http://192.169.26.221:3000"
    capture_inputs: true
    capture_outputs: true
    capture_tool_args: true
    capture_tool_results: true
    capture_reasoning: "metadata"
    max_field_chars: 12000
    sample_rate: 1.0
    timeout_seconds: 15
    flush_interval_seconds: 2
    flush_at: 32
    flush_on_run_end: false

mem0:
  enabled: true
  # Minimal local SDK mode: no Mem0 server, no dashboard, no extra middleware.
  # Reuses `providers.default_primary` as the fact-extraction LLM.
  # `api_key_env` is only used when mode = "server".
  mode: "sdk"
  agent_id: "yi-min"
  api_key_env: "MEM0_API_KEY"
  vector_store_path: "../workspace/mem0_qdrant"
  history_db_path: "../workspace/mem0_history.db"
  embedding:
    # Reuse the existing qwen provider (OPENAI_API_KEY env var, DashScope endpoint).
    provider_name: "qwen"
    model: "text-embedding-v4"
    # DashScope text-embedding-v4 defaults to 1024 dims and allows at most 10
    # inputs per batch. If you change dimensions later, rebuild the corresponding
    # workspace's `mem0_qdrant/` to avoid vector-schema mismatches.
    dimensions: 1024
    batch_size: 10

channels:
  instances:
    - name: "feishu"
      type: "feishu"
      workspace_dir: "../workspace"
      app_id_env: "FEISHU_APP_ID"
      app_secret_env: "FEISHU_APP_SECRET"
